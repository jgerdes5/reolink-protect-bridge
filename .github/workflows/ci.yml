name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Install ffmpeg (used by tests)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg

      - name: go vet
        run: go vet ./...

      - name: install.sh and the systemd unit have the same unit text
        run: |
          sed -n "/^cat >\"\$TMP\/unit\" <<'UNIT'\$/,/^UNIT\$/p" deploy/install.sh | sed '1d;$d' |
            diff -u deploy/systemd/reolink-protect-bridge.service -

      - name: go test
        run: go test -race -count=1 ./...

      - name: build
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w -X main.version=ci-${GITHUB_SHA::7}" -o dist/reolink-protect-bridge ./cmd/reolink-protect-bridge
