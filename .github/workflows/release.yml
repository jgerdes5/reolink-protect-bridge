name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub release
  packages: write   # push to ghcr.io

env:
  IMAGE: ghcr.io/jgerdes5/reolink-protect-bridge

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install ffmpeg (used by tests)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build static binaries
        env:
          VERSION: ${{ github.ref_name }}
          CGO_ENABLED: "0"
        run: |
          set -eu
          mkdir -p dist
          # os/arch/arm  -> asset suffix
          for t in linux/amd64/ linux/arm64/ linux/arm/7 darwin/arm64/; do
            os=${t%%/*}; rest=${t#*/}; arch=${rest%%/*}; arm=${rest#*/}
            name="reolink-protect-bridge_${os}_${arch}${arm:+v$arm}"
            echo "building $name"
            GOOS=$os GOARCH=$arch GOARM=$arm \
              go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o "dist/$name" ./cmd/reolink-protect-bridge
          done
          cd dist && sha256sum reolink-protect-bridge_* > SHA256SUMS && cat SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes \
              $([ "${TAG#*-}" != "$TAG" ] && echo --prerelease)
          fi

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3   # runtime stage runs apt-get per arch

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: tags
        env:
          TAG: ${{ github.ref_name }}
        run: |
          tags="$IMAGE:$TAG"
          # pre-releases (v1.2.3-rc1) do not move :latest
          case "$TAG" in *-*) ;; *) tags="$tags,$IMAGE:latest" ;; esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
